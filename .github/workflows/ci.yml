name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (tests, headless)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-linux.txt

      - name: System libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libportaudio2 \
            xvfb libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-linux.txt

      - name: Run tests (offscreen Qt + virtual X display for pynput)
        env:
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run -a python -m unittest discover -s tests -v

      - name: Smoke test (X11 virtual display)
        run: |
          xvfb-run -a python -c "
          import os, sys
          sys.path.insert(0, '.')
          from PySide6 import QtWidgets
          from ui import theme
          from ui.context import Context
          from ui.shell import MainWindow
          app = QtWidgets.QApplication([])
          theme.load_fonts()
          win = MainWindow(Context({'theme': 'light'}))
          win.resize(1100, 760)
          win.show()
          app.processEvents()
          assert win.stack.currentWidget() is not None
          print('UI starts on Linux:', win.stack.currentWidget().TITLE)
          "

  windows:
    name: Windows (tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v
