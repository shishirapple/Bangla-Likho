name: IBus input method

# Verifies that the IBus engine installs into a user profile and is really
# registered with a running daemon — the Linux-native typing path that works
# on Wayland too.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register:
    name: Engine registration
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install IBus and its Python bindings
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ibus python3-gi gir1.2-ibus-1.0 \
            xvfb dbus dbus-x11

      - name: Install the engine (user and system)
        run: |
          export HOME=/tmp/imehome
          mkdir -p "$HOME"
          bash ime/install-ime.sh --no-restart
          test -f "$HOME/.local/share/ibus/component/bangla-likho.xml"
          grep -q "Bangla Likho (Phonetic)" "$HOME/.local/share/ibus/component/bangla-likho.xml"
          test -x "$HOME/.local/bin/bangla-likho-ime"
          "$HOME/.local/bin/bangla-likho-ime" --check
          echo "--- system-wide installation ---"
          sudo bash ime/install-ime.sh --system --no-restart
          test -f /usr/share/ibus/component/bangla-likho.xml
          test -x /usr/local/bin/bangla-likho-ime
          sudo /usr/local/bin/bangla-likho-ime --check

      - name: Inspect what was installed
        env:
          HOME: /tmp/imehome
        run: |
          echo "HOME=$HOME"
          echo "----- component dir -----"
          ls -la "$HOME/.local/share/ibus/component/"
          echo "----- component xml -----"
          cat "$HOME/.local/share/ibus/component/bangla-likho.xml"
          echo "----- python parse of the component -----"
          /usr/bin/python3 - <<'PY'
          import gi
          gi.require_version("IBus", "1.0")
          from gi.repository import IBus
          path = "/tmp/imehome/.local/share/ibus/component/bangla-likho.xml"
          try:
              component = IBus.Component.new_from_file(path)
              print("parsed:", component.get_name())
              for engine in component.get_engines():
                  print("  engine:", engine.get_name(), "|", engine.get_longname())
          except Exception as exc:
              print("PARSE FAILED:", repr(exc))
          PY
          echo "----- engine --check -----"
          "$HOME/.local/bin/bangla-likho-ime" --check 2>&1 | head -5 || true

      - name: The daemon lists and activates the engine
        run: |
          dbus-run-session -- xvfb-run -a bash -euxo pipefail -c '
            rm -rf "$HOME/.cache/ibus"
            ibus-daemon -drx --panel=disable > /tmp/ibus.log 2>&1 &
            sleep 8
            ibus write-cache || true
            sleep 4
            ibus list-engine > /tmp/engines.txt 2>&1 || true
            grep -i "bangla" /tmp/engines.txt || echo "NO BANGLA ENGINE IN LIST"
            grep -q "bangla-likho" /tmp/engines.txt
            ibus engine bangla-likho || true
            sleep 4
            ibus engine | tee /tmp/current.txt || true
            grep -q "bangla-likho" /tmp/current.txt
          '

      - name: Show IBus log
        if: always()
        env:
          HOME: /tmp/imehome
        run: |
          echo "----- ibus.log (component/registry lines) -----"
          grep -i -E "component|registry|bangla|error|fail" /tmp/ibus.log 2>/dev/null | tail -40 || true
          echo "----- registry cache -----"
          find /tmp/imehome/.cache /root/.cache /home/runner/.cache -name registry 2>/dev/null || true
          for f in $(find /tmp/imehome/.cache -name registry 2>/dev/null); do
            echo "== $f"; strings "$f" 2>/dev/null | grep -i bangla || echo "(no bangla in registry)"
          done
          echo "----- glib user data dir -----"
          /usr/bin/python3 -c "from gi.repository import GLib; print(GLib.get_user_data_dir()); print(GLib.get_user_cache_dir())"
