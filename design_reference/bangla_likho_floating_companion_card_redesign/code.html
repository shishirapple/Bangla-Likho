<!DOCTYPE html><html lang="bn"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>বাংলা লিখো - Floating Widget</title>
<!-- Google Fonts: Hind Siliguri for Bengali & Inter for Latin/Numerics -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', '"Hind Siliguri"', 'sans-serif'],
            bengali: ['"Hind Siliguri"', '"Inter"', 'sans-serif']
          },
          colors: {
            brand: {
              teal: '#0e5f56',
              dark: '#0f3d37',
              mint: '#e6f4f1',
              accent: '#14b8a6'
            }
          },
          boxShadow: {
            'floating': '0 12px 36px -4px rgba(15, 61, 55, 0.08), 0 4px 16px -2px rgba(0, 0, 0, 0.04)',
            'pill': '0 1px 2px rgba(15, 23, 42, 0.04)'
          }
        }
      }
    };
  </script>
<!-- BEGIN: Custom Micro-Styles -->
<style data-purpose="custom-styling">
    body {
      background-color: #f6f8f7;
      background-image: radial-gradient(#d1ded9 0.75px, transparent 0.75px);
      background-size: 20px 20px;
    }
  </style>
<!-- END: Custom Micro-Styles -->
</head>
<body class="min-h-screen flex items-center justify-center p-4 antialiased selection:bg-brand-mint selection:text-brand-dark">
<!-- BEGIN: FloatingWidgetContainer -->
<main class="w-full max-w-[384px]" data-purpose="floating-widget-wrapper">
<!-- BEGIN: BanglaLikhoCard -->
<section class="bg-white/95 backdrop-blur-md border border-[#e2e8e5] rounded-[22px] p-4 shadow-floating transition-all duration-300 hover:shadow-xl hover:border-[#ccd7d3] select-none" data-purpose="widget-card" id="bangla-likho-widget">
<!-- BEGIN: HeaderRow -->
<header class="flex items-center justify-between gap-3 mb-3.5" data-purpose="widget-header">
<!-- Brand Identity Container -->
<div class="flex items-center gap-2.5">
<!-- App Icon (Bengali letter "ল।") -->
<div aria-label="বাংলা লিখো লোগো" class="w-9 h-9 rounded-xl bg-gradient-to-br from-[#11695f] to-[#0d5048] text-white flex items-center justify-center shadow-sm flex-shrink-0">
<span class="font-bengali font-bold text-lg leading-none tracking-tight">ল।</span>
</div>
<!-- Brand Title -->
<div class="flex flex-col">
<h1 class="font-bengali font-bold text-slate-800 text-[17px] leading-tight tracking-normal">
              বাংলা লিখো
            </h1>

</div>
</div>
<!-- Controls: Language Badge & Close Action -->
<div class="flex items-center gap-1.5" data-purpose="header-controls">
<!-- Active Mode Indicator Badge -->
<button class="px-2.5 py-1 bg-[#ebf7f3] hover:bg-[#dcf0ea] border border-[#d4ede4] text-[#0f675c] rounded-lg text-xs font-semibold tracking-wider transition-colors duration-150 flex items-center gap-1 cursor-pointer" title="বর্তমান টাইপিং মোড: English" type="button">
<span class="w-1.5 h-1.5 rounded-full bg-[#10b981] animate-pulse"></span>
<span>EN</span>
</button>
<!-- Dismiss / Close Button -->
<button aria-label="বন্ধ করুন" class="w-7 h-7 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 flex items-center justify-center text-sm font-medium transition-all duration-150" type="button">
<svg class="w-4 h-4 stroke-current stroke-2" fill="none" viewBox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</header>
<!-- END: HeaderRow -->
<!-- BEGIN: ActionButtonsGrid -->
<!-- Middle Row: Interactive Action Pills for Input Mode Switch & Voice Typing -->
<nav aria-label="টাইপিং অপশনসমূহ" class="grid grid-cols-2 gap-2" data-purpose="keyboard-actions">
<!-- Button 1: English Mode Toggle -->
<button class="group relative flex items-center justify-between px-3 py-2.5 bg-[#f8faf9] hover:bg-white active:bg-slate-50 border border-[#e2e8e5] hover:border-[#cbd5e1] rounded-xl text-left transition-all duration-150 shadow-pill hover:shadow cursor-pointer" type="button">
<div class="flex flex-col">
<span class="text-xs font-semibold text-slate-700 group-hover:text-slate-900 transition-colors">
              English mode
            </span>
<span class="text-[10px] text-slate-400 font-medium">কীবোর্ড মোড</span>
</div>
<!-- Keyboard Shortcut Pill -->

</button>
<!-- Button 2: Voice Typing (ভয়েস টাইপিং) -->
<button class="group relative flex items-center justify-between px-3 py-2.5 bg-[#f8faf9] hover:bg-white active:bg-slate-50 border border-[#e2e8e5] hover:border-[#cbd5e1] rounded-xl text-left transition-all duration-150 shadow-pill hover:shadow cursor-pointer" type="button">
<div class="flex items-center gap-2">
<!-- Voice/Mic Icon Container -->
<div class="w-6 h-6 rounded-md bg-[#eef7f4] text-[#0f675c] group-hover:bg-[#0f675c] group-hover:text-white flex items-center justify-center transition-colors">
<svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 20 20">
<path d="M10 2a3 3 0 00-3 3v5a3 3 0 006 0V5a3 3 0 00-3-3z"></path>
<path d="M4 10a1 1 0 011 1 5 5 0 0010 0 1 1 0 112 0 7.002 7.002 0 01-6 6.93V19a1 1 0 11-2 0v-1.07A7.002 7.002 0 013 11a1 1 0 011-1z"></path>
</svg>
</div>
<div class="flex flex-col">
<span class="font-bengali text-xs font-semibold text-slate-800 group-hover:text-slate-950 transition-colors">
                ভয়েস টাইপিং
              </span>
<span class="text-[10px] text-slate-400 font-medium font-bengali">কথা বলুন</span>
</div>
</div>
<!-- Voice Shortcut Pill -->

</button>
</nav>
<!-- END: ActionButtonsGrid -->
<!-- BEGIN: MicroFooter -->
<footer class="mt-3 pt-2.5 border-t border-slate-100 flex items-center justify-between text-[11px]" data-purpose="widget-status-bar">
<!-- Status Indicator -->
<div class="flex items-center gap-1.5 text-slate-500 font-bengali">
<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
<span>অভ্র/ফোনেটিক কীবোর্ড প্রস্তুত</span>
</div>
<!-- Quick Settings Gear Toggle -->
<button aria-label="কীবোর্ড সেটিংস" class="p-1 rounded-md text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition-colors" title="সেটিংস পরিবর্তন করুন" type="button">
<svg class="w-3.5 h-3.5 stroke-current stroke-[1.8]" fill="none" viewBox="0 0 24 24">
<path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</footer>
<!-- END: MicroFooter -->
</section>
<!-- END: BanglaLikhoCard -->
</main>
<!-- END: FloatingWidgetContainer -->


</body></html>
